[project]
name = "maciota-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Davi Lucciola", email = "davilucciola14@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
]

[project.scripts]
maciota-bot = "maciota_bot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3",
    "pytest-cov>=6.1.1",
    "pytest-sugar>=1.1.1",
    "ruff>=0.11.11",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: testes unitários (tests/unit)",
    "integration: testes de integração (tests/integration)",
    "client: construção do cliente Discord",
    "config: leitura do token",
    "events: eventos de ready, message e entrada de membro",
    "services: texto de boas-vindas",
    "logs: formatação e configuração de logs",
    "startup: arranque do processo",
    "db: persistência do canal de boas-vindas",
    "commands: comando de canal de boas-vindas",
]

[tool.coverage.run]
concurrency = ["thread"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
